name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # CDK bundles each Lambda folder as-is. Node 20 does not include the AWS
      # SDK v3 packages used by the auth and WebSocket handlers.
      - name: Install lambda dependencies
        run: |
          for dir in lambdas/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "::group::$dir"
              (cd "$dir" && npm ci --no-audit --no-fund)
              echo "::endgroup::"
            fi
          done

      - name: Typecheck
        run: npm run typecheck

      - name: CDK typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Square of Shadows browser smoke
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:sos:smoke

      - name: CDK synth
        run: npx cdk synth --quiet
