[build]
  command = "npm run build"
  publish = "dist"

# Flip procedural rendering into sprite-atlas rendering
# (see frontend/src/components/CasinoMap.tsx USE_SPRITE_ATLAS). Real atlases live
# in assets/sprites/generated/* -> frontend/public/sprites/* (npm run sprites:copy).
# Procedural art stays the load-failure fallback, so this flag is safe to keep on.
[build.environment]
  NODE_VERSION = "20"
  VITE_USE_SPRITE_ATLAS = "1"
  VITE_BASE_PATH = "/games/"

[[redirects]]
  from = "/games"
  to = "/games/"
  status = 301

[[redirects]]
  from = "/games/*"
  to = "/games/index.html"
  status = 200
