services:
  - type: web
    name: outlands-server
    runtime: node
    plan: starter
    buildCommand: npm install && npm run outlands:server:build
    startCommand: npm run outlands:server:run
    healthCheckPath: /health
    disk:
      name: outlands-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: AWS_REGION
        value: us-east-2
      - key: OUTLANDS_HOST
        value: 0.0.0.0
      - key: OUTLANDS_STATE_FILE
        value: /opt/render/project/src/data/outlands-sector-07.json
      - key: OUTLANDS_ALLOWED_ORIGINS
        value: https://chimerical-capybara-0b55e9.netlify.app
      - key: USER_POOL_ID
        sync: false
      - key: USER_POOL_CLIENT_ID
        value: 1vuv9q9um88odm8cgcct6p7705
      - key: OUTLANDS_ROOM_CAPACITY
        value: "8"