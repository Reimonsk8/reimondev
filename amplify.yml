version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm ci --legacy-peer-deps --cache .npm --prefer-offline
        - cd casino-games && npm ci --cache ../.npm --prefer-offline && cd ..
    build:
      commands:
        - npm run build
        - cd casino-games && npm run build && cd ..
        - mkdir -p build/games
        - cp -R casino-games/dist/. build/games/
  artifacts:
    baseDirectory: build
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
